<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spatial 001 · Before / After Visual QA</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      body { margin: 0; padding: 24px; background: #e9e5d9; color: #173735; }
      h1 { margin: 0 0 18px; font-size: 20px; font-weight: 600; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
      figure { margin: 0; padding: 12px; background: #f8f4e9; box-shadow: 0 4px 18px rgba(24, 55, 53, .12); }
      figcaption { margin-bottom: 9px; font-size: 13px; letter-spacing: .05em; }
      img { display: block; width: 100%; height: auto; border: 1px solid rgba(24, 55, 53, .14); }
    </style>
  </head>
  <body>
    <h1>Spatial Experience 001 · 同视口前后对照</h1>
    <div class="grid">
      <figure><figcaption>Before · 488×642 地图只是氛围/地点入口</figcaption><img src="01-map-current.png" alt="改造前 488×642 地图" /></figure>
      <figure><figcaption>After · 488×642 三层空间镜头与真实相对方向</figcaption><img src="18-map-final-488x642.png" alt="改造后 488×642 地图" /></figure>
      <figure><figcaption>Before · 庐山阅读中失去宏观位置</figcaption><img src="02-lushan-reading-current.png" alt="改造前庐山阅读" /></figure>
      <figure><figcaption>After · 空间锚在正常流中，诗仍是主内容</figcaption><img src="05-lushan-reading-desktop-spatial.png" alt="改造后庐山阅读" /></figure>
    </div>
  </body>
</html>
