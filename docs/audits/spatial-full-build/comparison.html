<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>山河诗境 · Spatial Full Build Comparison</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #183d39;
        background: #e9e6da;
      }

      * { box-sizing: border-box; }

      body { margin: 0; padding: 40px; }

      header { max-width: 1160px; margin: 0 auto 32px; }

      h1 { margin: 0 0 8px; font-family: serif; font-weight: 500; }

      p { margin: 0; color: #60706a; line-height: 1.6; }

      main { display: grid; gap: 36px; max-width: 1160px; margin: 0 auto; }

      section {
        padding: 24px;
        border: 1px solid rgba(58, 83, 75, .18);
        background: rgba(250, 248, 239, .78);
        box-shadow: 0 18px 60px rgba(43, 62, 56, .08);
      }

      body.compare-target main > section { display: none; }

      body.compare-target main > section.is-active {
        position: fixed;
        inset: 150px 40px auto;
        display: block;
        width: min(1160px, calc(100% - 80px));
        margin-inline: auto;
      }

      h2 { margin: 0 0 18px; font-size: 16px; font-weight: 650; letter-spacing: .05em; }

      .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

      figure { margin: 0; }

      .frame {
        aspect-ratio: 16 / 10;
        display: grid;
        place-items: center;
        overflow: hidden;
        border: 1px solid rgba(58, 83, 75, .16);
        background: #f6f3e9;
      }

      img { width: 100%; height: 100%; object-fit: contain; display: block; }

      figcaption { margin-top: 10px; color: #53645e; font-size: 13px; line-height: 1.5; }

      strong { color: #9c493a; font-weight: 650; }

      @media (max-width: 760px) {
        body { padding: 20px; }
        .pair { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Spatial Full Build · Combined Visual QA</h1>
      <p>每组把视觉目标／重构前画面与真实实现放在同一个比较面板中，用来检查信息层级、地图角色、阅读保护与整体气质。</p>
    </header>
    <main>
      <section id="world">
        <h2>01 · WORLD / 文明地图成为首屏骨架</h2>
        <div class="pair">
          <figure><div class="frame"><img src="../../research/spatial-full-build/concept-world-atlas.png" alt="文明地图概念视觉" /></div><figcaption><strong>视觉目标</strong>：文明地图、克制标注、博物馆式留白。</figcaption></figure>
          <figure><div class="frame"><img src="after/01-world-1440x900.png" alt="最终首屏实现" /></div><figcaption><strong>真实实现</strong>：中国物理山河骨架成为第一视觉任务，庐山是唯一首访入口。</figcaption></figure>
        </div>
      </section>
      <section id="before-after">
        <h2>02 · BEFORE / AFTER / 地图从气氛背景变成可读空间</h2>
        <div class="pair">
          <figure><div class="frame"><img src="before/01-world-desktop.png" alt="重构前首屏" /></div><figcaption><strong>重构前</strong>：手工山水封面，无法建立全国方向与可复算位置。</figcaption></figure>
          <figure><div class="frame"><img src="after/01-world-1440x900.png" alt="重构后首屏" /></div><figcaption><strong>重构后</strong>：真实公开地理数据生成路径，地图不再是装饰。</figcaption></figure>
        </div>
      </section>
      <section id="lens">
        <h2>03 · LENS / 从中国连续靠近长江中游</h2>
        <div class="pair">
          <figure><div class="frame"><img src="../../research/spatial-full-build/concept-continuous-lens.png" alt="连续镜头概念视觉" /></div><figcaption><strong>视觉目标</strong>：地图像镜头一样靠近，保留尺度连续性。</figcaption></figure>
          <figure><div class="frame"><img src="after/02-region-1440x900.png" alt="长江中游区域镜头实现" /></div><figcaption><strong>真实实现</strong>：长江、鄱阳湖、九江、庐山及观察问题共同组成区域镜头。</figcaption></figure>
        </div>
      </section>
      <section id="reading">
        <h2>04 · READING / 地图退场，诗成为无条件主内容</h2>
        <div class="pair">
          <figure><div class="frame"><img src="before/02-lushan-reading-desktop.png" alt="重构前阅读态" /></div><figcaption><strong>保留优势</strong>：全诗、拼音与静谧阅读气质。</figcaption></figure>
          <figure><div class="frame"><img src="after/03-reading-1440x900.png" alt="重构后阅读态" /></div><figcaption><strong>强化之后</strong>：空间 breadcrumb 与三枚诗意线索保留地点感，所有引导保持在正常文档流。</figcaption></figure>
        </div>
      </section>
      <section id="memory">
        <h2>05 · MEMORY / 完成不是弹出下一站，而是地图长出记忆</h2>
        <div class="pair">
          <figure><div class="frame"><img src="../../research/spatial-full-build/concept-memory-journey.png" alt="山河记忆概念视觉" /></div><figcaption><strong>视觉目标</strong>：足迹、诗与下一方向成为一张可增长的个人山河图。</figcaption></figure>
          <figure><div class="frame"><img src="after/05-journey-1440x900.png" alt="完成旅程实现" /></div><figcaption><strong>真实实现</strong>：庐山足迹、约 195 公里直线关系、非历史路线说明与黄鹤楼方向同屏呈现。</figcaption></figure>
        </div>
      </section>
    </main>
    <script>
      const target = document.querySelector(window.location.hash);
      if (target) {
        document.body.classList.add("compare-target");
        target.classList.add("is-active");
      }
    </script>
  </body>
</html>
